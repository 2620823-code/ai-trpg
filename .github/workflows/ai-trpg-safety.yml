name: AI-TRPG safety checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run AI endpoint regression tests
        run: node --test tests/gm-api.test.js
      - name: Check API JavaScript syntax
        run: node --check api/gm.js
